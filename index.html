<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorpresa para la Mejor Enfermera</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>¡Sorpresa para la Mejor Enfermera!</h1>
    </header>

    <main>
        <!-- Sección de sobre animado -->
        <section class="envelope-section">
            

            <h2>¡Tienes un mensaje especial!</h2>
            <div class="envelope-container">
                <img id="envelopeImg" src="cerrado.png.png" alt="Sobre cerrado">
            </div>
            
            <!-- Imagen oculta del mensaje de cumpleaños -->
            <img id="birthdayImage" src="mensaje.png" alt="Mensaje de cumpleaños">
            <p id="birthdayMessage" class="hidden">🎉 ¡Feliz Cumpleaños Eri,que Dios te bendiga
                hoy y siempre, que todos tus deseos se cumplan! 🎂🎁🎈</p>
        </section>
      
    </main>

    <footer>
        <p>Un poco simple,pero espero y te guste</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
